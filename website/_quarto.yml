project:
  type: website
  output-dir: _site
  post-render:
    - scripts/fix_home_citations.py

lang: en

bibliography: references.bib

execute:
  enabled: true
  # `true`, not `auto`: `auto` re-executes a notebook whose md5 differs from
  # the one recorded in _freeze, and the md5 CI sees is not the one this
  # working tree renders — the `nbstripout` clean filter rewrites the
  # notebook on commit, so the committed blob never matches the freeze entry
  # written from the local copy (with outputs). CI installs Quarto only, no
  # Python and no notas-archivo/ data, so a re-execution there is a hard
  # failure. Refresh results locally with `quarto render --no-freeze`.
  freeze: true

website:
  title: "LegalIA"
  site-url: https://ingeotec.github.io/LegalIA/
  repo-url: https://github.com/INGEOTEC/LegalIA
  navbar:
    background: "#f9f8f4"
    left:
      - href: index.ipynb
        text: Home
      - href: pages/dataset.ipynb
        text: Dataset
      - href: pages/titles.ipynb
        text: DOF Titles
      - href: pages/leyes.ipynb
        text: Federal Laws
      - href: pages/tools.ipynb
        text: Tools
      - href: pages/dof2md.ipynb
        text: dof2md
      - href: pages/references.qmd
        text: References
      - href: https://github.com/INGEOTEC/LegalIA/issues/views/8351
        text: Research
      - href: https://legalia.readthedocs.io/
        text: Docs
    right:
      - icon: github
        href: https://github.com/INGEOTEC/LegalIA
        aria-label: GitHub
  page-footer:
    center: >
      LegalIA · [INGEOTEC](https://github.com/INGEOTEC) ·
      Code under the Apache 2.0 license

format:
  html:
    theme: [litera, style.scss]
    toc: true
    number-sections: true
    fig-dpi: 150
    fig-width: 8
    fig-height: 4.2
    link-external-newwindow: true
    code-fold: true
