[project]
name = "legalia"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
# The root has no source of its own -- it only glues the packages below
# into one uv workspace/venv, so it must never be built or installed.
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# document2md is not listed here: it left this monorepo for
# https://github.com/INGEOTEC/document2md (issues #233, #234), and since 0.3.0
# reached PyPI (2026-09-13) this repository takes it from PyPI like any outside
# user does — the pinned-git bridge #234 needed was deleted in issue #235.
dofjson = { workspace = true }
legalvec = { workspace = true }
md2akn = { workspace = true }
nota2md = { workspace = true }
scjn = { workspace = true }

[dependency-groups]
# `uv sync` installs every package editable, with its test extra, into one
# .venv -- mirroring the matrix in .github/workflows/test.yml and the
# pytest commands in CLAUDE.md. nota2md's `ocr` extra is included so its
# document2md-backed OCR path is importable too (pulling document2md in
# from PyPI), matching what .devcontainer/python.sh already installs.
dev = [
    "dofjson[test]",
    "legalvec[test]",
    "md2akn[test]",
    "nota2md[ocr,test]",
    "scjn[test]",
]
# The exploratory-analysis group (issue #241): what `scripts/embeddings/`'s
# UMAP scripts need and nothing else does. Deliberately kept out of `dev`, so
# the package test matrix does not pay for umap-learn's numba/scikit-learn
# stack -- run those scripts with `uv run --group viz ...`. `numpy`/`pyarrow`
# arrive with legalvec.
viz = [
    "umap-learn",
    "pynndescent",
    "altair",
    "pandas",
    # Altair's Vega-Lite compiler, for two things build_umap_html.py does:
    # its `--inline-js` path, and the offline check that the compiled Vega
    # really carries the cross-view `clear` streams the page's "last click
    # wins" rule is made of (issue #241, third pass) -- a session with no
    # browser cannot click, so the compiled signals are the evidence.
    "vl-convert-python",
]
