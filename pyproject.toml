[project]
name = "legalia"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
# The root has no source of its own -- it only glues the packages below
# into one uv workspace/venv, so it must never be built or installed.
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# document2md is not listed here: it left this monorepo for
# https://github.com/INGEOTEC/document2md (issues #233, #234), and since 0.3.0
# reached PyPI (2026-09-13) this repository takes it from PyPI like any outside
# user does — the pinned-git bridge #234 needed was deleted in issue #235.
dofjson = { workspace = true }
legalvec = { workspace = true }
md2akn = { workspace = true }
nota2md = { workspace = true }
scjn = { workspace = true }

[dependency-groups]
# `uv sync` installs every package editable, with its test extra, into one
# .venv -- mirroring the matrix in .github/workflows/test.yml and the
# pytest commands in CLAUDE.md. nota2md's `ocr` extra is included so its
# document2md-backed OCR path is importable too (pulling document2md in
# from PyPI), matching what .devcontainer/python.sh already installs.
dev = [
    "dofjson[test]",
    "legalvec[test]",
    "md2akn[test]",
    "nota2md[test]",
    # ...everywhere except an Intel Mac. The `ocr` extra reaches mineru, which
    # requires onnxruntime, whose last macOS x86_64 wheel was 1.23.2 (every
    # release mineru accepts is arm64-only there). Listing it unconditionally
    # made `uv sync` -- and therefore *every* `uv run <anything>`, including
    # `uv run legalvec download` -- fail outright on that platform with
    # "onnxruntime ... doesn't have a source distribution or wheel for the
    # current platform". The marker trades the OCR path, which cannot run on
    # an Intel Mac anyway, for a workspace that installs: the four nota2md
    # tests that patch `document2md.converter.*` skip themselves there, and
    # CI (Linux) installs the package explicitly and still runs them.
    "nota2md[ocr]; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "scjn[test]",
]
# The exploratory-analysis group (issue #241): what `scripts/embeddings/`'s
# UMAP scripts need and nothing else does. Deliberately kept out of `dev`, so
# the package test matrix does not pay for umap-learn's numba/scikit-learn
# stack -- run those scripts with `uv run --group viz ...`. `numpy`/`pyarrow`
# arrive with legalvec.
viz = [
    "umap-learn",
    "pynndescent",
    "altair",
    "pandas",
    # Altair's Vega-Lite compiler, for two things build_umap_html.py does:
    # its `--inline-js` path, and the offline check that the compiled Vega
    # really carries the cross-view `clear` streams the page's "last click
    # wins" rule is made of (issue #241, third pass) -- a session with no
    # browser cannot click, so the compiled signals are the evidence.
    "vl-convert-python",
    # The website's Atlas (issue #245) is a hand-written D3 page; its tests
    # load, click, search and screenshot it in headless Chromium. Needs a
    # one-time `uv run --group viz playwright install chromium`; without the
    # browser those tests skip and the static checks still run.
    "playwright",
    # The Atlas' lexical baseline (issue #267): `bm25s` builds the BM25 index
    # as a sparse score matrix and `scipy` multiplies against it. Cluster-side
    # research tooling like UMAP, so not in `dev`; `PyStemmer` is deliberately
    # absent (no stemming).
    "bm25s>=0.3.11",
    "scipy",
    # Louvain communities of the instrument matrix (issue #285,
    # `cluster_instruments.py`). Present transitively today; named so the import
    # is deliberate. Leiden would need `igraph`, which is not added.
    "networkx",
]
