[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dofjson"
description = "Prototype client for SIDOF's undocumented JSON open data service for Mexico's official gazette (DOF)."
readme = "README.md"
license = { text = "Apache-2.0" }
# 3.10 for the `X | None` annotations the package already evaluates at import.
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "requests>=2.31",
    "pypdf>=3.0",
    "platformdirs>=4.0",
]
dynamic = ['version']

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/INGEOTEC/LegalIA/tree/main/packages/dofjson"

[project.scripts]
dofjson = "dofjson.cli:main"

[tool.setuptools.packages.find]
include = ["dofjson", "dofjson.*"]

[tool.setuptools.package-data]
# The certificate chain dofweb needs to verify www.dof.gob.mx, whose server
# omits the intermediate that signs it.
dofjson = ["certs/*.pem"]

[tool.setuptools.dynamic]
version = {attr = 'dofjson.__version__'}
