[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leyesmx"
version = "0.2.1"
description = "Reform history of Mexican federal legislation, linked to the DOF notes that published it."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "requests>=2.31",
    # 0.3 trae titulos.lee_titulos. Antes esto usaba
    # microtc.utils.tweet_iterator, que lee el mismo formato pero
    # arrastra numpy sin declararlo.
    "dofjson>=0.3.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/INGEOTEC/LegalIA/tree/main/packages/leyesmx"

[project.scripts]
leyesmx = "leyesmx.cli:main"

[tool.setuptools.packages.find]
include = ["leyesmx", "leyesmx.*"]
