[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leyesmx"
description = "Reform history of Mexican federal legislation, linked to the DOF notes that published it."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "requests>=2.31",
    # 0.5 trae titulos.legal_provisions_titles, el flujo de titulos que
    # cli.py consume, y con el se fue el dataset en disco que se leia antes
    # (issue #166). Antes de 0.3 esto usaba microtc.utils.tweet_iterator,
    # que lee el mismo formato pero arrastra numpy sin declararlo.
    "dofjson>=0.5.0",
]
dynamic = ['version']

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/INGEOTEC/LegalIA/tree/main/packages/leyesmx"

[project.scripts]
leyesmx = "leyesmx.cli:main"

[tool.setuptools.packages.find]
include = ["leyesmx", "leyesmx.*"]

[tool.setuptools.dynamic]
version = {attr = 'leyesmx.__version__'}
