[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dof2md"
description = "Renamed to document2md: this release only tells you where the code went."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# No runtime dependencies on purpose: the tombstone must not drag in mineru,
# and it deliberately does not depend on `document2md` either — that would let
# `pip install dof2md` keep working through a transitive import, which is the
# shim behaviour issue #228 rejected.
dependencies = []
dynamic = ['version']

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/INGEOTEC/LegalIA/tree/main/packages/document2md"

[tool.setuptools.packages.find]
include = ["dof2md", "dof2md.*"]

[tool.setuptools.dynamic]
version = {attr = 'dof2md.__version__'}

# A renamed package's final release: `scripts/check_package_versions.py` skips
# the "one step ahead of PyPI" gate for it (issue #228).
[tool.legalia]
tombstone = true
