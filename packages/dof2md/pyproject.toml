[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dof2md"
description = "Convert a PDF or a set of scanned page images to Markdown via OCR."
readme = "README.md"
license = { text = "Apache-2.0" }
# 3.10 for the PEP 604 unions (`X | None`) the package evaluates at import:
# they sit in function signatures, so they run when the module is defined.
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "requests>=2.31",
    "mineru[pipeline]",
]
dynamic = ['version']

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/INGEOTEC/LegalIA/tree/main/packages/dof2md"

[project.scripts]
dof2md = "dof2md.cli:main"

[tool.setuptools.packages.find]
include = ["dof2md", "dof2md.*"]

[tool.setuptools.dynamic]
version = {attr = 'dof2md.__version__'}
