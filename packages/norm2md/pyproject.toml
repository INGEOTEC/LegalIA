[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "norm2md"
version = "0.1.0"
description = "Read back a Mexican legislative-history collection (laws, regulations, normas, treaties) from the historial-legislativo release."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/INGEOTEC/LegalIA/tree/main/packages/norm2md"

[tool.setuptools.packages.find]
include = ["norm2md", "norm2md.*"]
