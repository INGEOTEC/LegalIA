[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legalvec"
description = "Disk-first reader for LegalIA's vector releases: one embedding per distinct text of every Mexican federal law, reglamento and lineamiento."
readme = "README.md"
license = { text = "Apache-2.0" }
# 3.10 for the PEP 604 unions (`X | None`) the package evaluates at import.
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# This package reads a release of its own and nothing else in the monorepo:
# it imports neither scjn nor md2akn (see tests/test_boundary.py). pyarrow
# and numpy are the two dependencies a vector reader cannot avoid, and the
# reason this is not part of `scjn` at all.
dependencies = [
    "requests>=2.31",
    "platformdirs>=4.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
]
dynamic = ['version']

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/INGEOTEC/LegalIA/tree/main/packages/legalvec"

[tool.setuptools.packages.find]
include = ["legalvec", "legalvec.*"]

[tool.setuptools.dynamic]
version = {attr = 'legalvec.__version__'}
