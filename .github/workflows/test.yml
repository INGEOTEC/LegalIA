name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [dof2md, dofjson, md2akn, nota2md]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies (mineru's opencv needs libGL)
        if: matrix.package == 'dof2md' || matrix.package == 'nota2md'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0
      - name: Install sibling packages (dofjson, dof2md) for nota2md
        if: matrix.package == 'nota2md'
        run: |
          pip install -e packages/dofjson
          pip install -e packages/dof2md
      - name: Install package and test dependencies
        run: pip install -e "packages/${{ matrix.package }}[test]"
      - name: Run tests
        run: pytest packages/${{ matrix.package }}

  # Runs the documentation's worked examples for real (network included:
  # SIDOF, www.dof.gob.mx, the SCJN), separate from the per-package pytest
  # matrix above so a SIDOF outage fails only the docs gate. Read the Docs'
  # own build stays HTML-only and never depends on those services (issue
  # #195, Docs Phase 0).
  docs-doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies (dot renders the architecture diagrams)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      - name: Cache nota2md/dofjson's on-disk release caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nota2md
            ~/.cache/dofjson
          key: docs-doctest-cache-v1
      - name: Install docs and package dependencies
        run: |
          pip install -r docs/requirements.txt
          pip install -e packages/dofjson
          pip install -e packages/nota2md
          # --no-deps: keeps the heavy mineru[pipeline] install out of this
          # job too — dof2md's OCR-dependent examples are marked
          # `# doctest: +SKIP` and verified instead by its own pytest suite
          # (see docs/source/dof2md_api.rst).
          pip install --no-deps -e packages/dof2md
          pip install -e packages/md2akn
      - name: Run the documentation's doctest examples
        run: python -m sphinx -b doctest docs/source docs/build/doctest

  # Informational for now (issue #194): dofjson and nota2md already violate
  # the single-step-ahead rule (both two minor versions ahead of PyPI), so
  # making this a hard gate today would fail every PR until that drift is
  # reconciled by a release, not by this check. `continue-on-error: true`
  # keeps the job's own red/green visible without failing the workflow.
  check-package-versions:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: pip install packaging
      - name: Check package versions against PyPI
        run: python scripts/check_package_versions.py
