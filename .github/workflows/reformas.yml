name: reformas

# Rebuilds each law's reform table and commits it when it changes, so the
# repository accumulates the legislative history as it happens.

on:
  schedule:
    # 10:00 UTC (04:00 en Ciudad de México) del día 2 de cada mes, después de
    # que notas-archivo.yml publica el mes que acaba de cerrar.
    - cron: "0 10 2 * *"
  workflow_dispatch:
    inputs:
      ley:
        description: "Abreviatura de LeyesBiblio (p. ej. cpeum), o 'todas'"
        default: todas

jobs:
  reformas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install -e packages/dofjson -e packages/leyesmx
      # In 'todas' mode --out is the directory the per-law files go in; for a
      # single law it is that law's file.
      - name: Build the reform tables
        env:
          LEY: ${{ inputs.ley || 'todas' }}
        run: |
          if [ "$LEY" = "todas" ]; then
            salida="packages/leyesmx/data/reformas"
          else
            salida="packages/leyesmx/data/reformas/$LEY.json"
          fi
          python -m leyesmx --ley "$LEY" \
            --titulos "${RUNNER_TEMP}/titulos.jsonl.gz" --out "$salida"
      - name: Commit if the table changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- packages/leyesmx/data/reformas; then
            echo "sin cambios"
            exit 0
          fi
          git add packages/leyesmx/data/reformas
          git commit -m "Actualiza las tablas de reformas (${{ inputs.ley || 'todas' }})"
          git push
