name: reformas

# Rebuilds the legislative history every month and keeps it in exactly one
# place: the `historial-legislativo` release. Nothing is committed to git —
# the data is built fresh into a scratch directory on the runner and packed
# straight from there, so the repository never carries a copy to fall out of
# sync with the release.
#
# The release is verified on every run and only the assets whose bytes actually
# changed are re-uploaded — the tarballs are byte-reproducible, so identical
# data is an identical file (see scripts/empaqueta_historial.py).

on:
  schedule:
    # 10:00 UTC (04:00 en Ciudad de México) del día 2 de cada mes, después de
    # que notas-archivo.yml publica el mes que acaba de cerrar.
    - cron: "0 10 2 * *"
  workflow_dispatch:
    inputs:
      ley:
        description: "'todo', 'todas', 'reglamentos', 'normas', 'tratados' o una abreviatura"
        default: todo

env:
  TAG: historial-legislativo

jobs:
  reformas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install -e packages/dofjson -e packages/leyesmx

      # Since data no longer lives in git, a single-abbreviation dispatch (e.g.
      # `cpeum`) needs the rest of that collection seeded from the release
      # itself, or packing would ship a leyes.tgz with one law and no index.
      # A `todo`/`todas`/... run overwrites everything this seeds anyway.
      - name: Seed with what the release already publishes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          datos="${RUNNER_TEMP}/datos"
          mkdir -p "$datos/reformas/reglamentos" "$datos/normas" "$datos/tratados"
          assets="${RUNNER_TEMP}/assets"
          mkdir -p "$assets"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
               --dir "$assets" --clobber 2>/dev/null; then
            tar xzf "$assets/leyes.tgz" -C "$datos/reformas"
            tar xzf "$assets/reglamentos.tgz" -C "$datos/reformas/reglamentos"
            tar xzf "$assets/normas.tgz" -C "$datos/normas"
            tar xzf "$assets/tratados.tgz" -C "$datos/tratados"
          else
            echo "el release $TAG aún no existe; se construye desde cero"
          fi

      # 'todo' rebuilds every collection, which is what the monthly run needs:
      # targeting one would leave the other three to go stale. The DOF titles
      # are streamed from the notas-archivo cache, populated once here and
      # reused by every build.
      - name: Build
        env:
          LEY: ${{ inputs.ley || 'todo' }}
        run: |
          set -eu
          cache="${RUNNER_TEMP}/notas-archivo"
          datos="${RUNNER_TEMP}/datos"
          python -c "
import dofjson
dofjson.download_dof_assets('$cache', log=lambda *_: None)
"
          construye() {
            case "$1" in
              todas)       salida="$datos/reformas" ;;
              reglamentos) salida="$datos/reformas/reglamentos" ;;
              normas)      salida="$datos/normas" ;;
              tratados)    salida="$datos/tratados" ;;
              *)           salida="$datos/reformas/$1.json" ;;
            esac
            python -m leyesmx --ley "$1" --cache-dir "$cache" --out "$salida"
          }
          if [ "$LEY" = "todo" ]; then
            for coleccion in todas reglamentos normas tratados; do
              construye "$coleccion"
            done
          else
            construye "$LEY"
          fi

      - name: Pack the release assets
        run: ./scripts/empaqueta_historial.py --datos "${RUNNER_TEMP}/datos" --outdir historial

      # Created on the first run; from then on it is only updated.
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "el release $TAG ya existe"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Historial legislativo" \
              --notes-file .github/historial-legislativo.md
          fi

      # A byte comparison, not a guess: an unchanged collection rebuilds to the
      # same file, so anything that differs really differs.
      - name: Upload only what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p publicado
          cambiados=""
          for asset in historial/*; do
            nombre=$(basename "$asset")
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --pattern "$nombre" --dir publicado --clobber 2>/dev/null \
               && cmp -s "publicado/$nombre" "$asset"; then
              echo "= $nombre sin cambios"
            else
              echo "~ $nombre cambió"
              cambiados="$cambiados $asset"
            fi
          done
          if [ -z "$cambiados" ]; then
            echo 'El release ya estaba al día.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # --clobber replaces in place, so the release is never left with an
          # asset missing the way delete-then-upload would.
          gh release upload "$TAG" $cambiados --clobber --repo "$GITHUB_REPOSITORY"
          {
            echo '## Assets actualizados'
            for a in $cambiados; do echo "- \`$(basename "$a")\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify what the release now serves
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          rm -rf verificacion && mkdir verificacion
          cd verificacion
          for asset in ../historial/*; do
            nombre=$(basename "$asset")
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$nombre" --clobber
            if ! cmp -s "$nombre" "$asset"; then
              echo "::error::$nombre en el release no coincide con lo construido"
              exit 1
            fi
            echo "$nombre OK"
          done
