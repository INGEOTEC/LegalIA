name: Publish website

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      # The Atlas pair explanations (issues #249/#250, four corpora since #283):
      # ~12,000 JSON files per data set, ~215-236 MB each (~46-49 MB compressed),
      # too big for git, so they live in the `atlas-pairs` release,
      # which a human publishes by running the PUBLICAR.md that
      # scripts/embeddings/export_atlas_pairs.py generates (issue #115,
      # Hallazgo C). This step only copies that already-published asset into
      # the site; the workflow publishes nothing SCJN-derived of its own. It
      # fails when the release or the asset is missing: a site without the
      # files would answer every click with "not available".
      - name: Fetch the Atlas pair explanations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          download=/tmp/atlas-pairs
          mkdir -p "$download/unpacked"
          gh release download atlas-pairs --repo "$GITHUB_REPOSITORY" \
            --pattern 'atlas-pairs.tar.gz' --pattern 'SHA256SUMS.txt' --dir "$download"
          test -s "$download/atlas-pairs.tar.gz"
          grep -q '  atlas-pairs.tar.gz$' "$download/SHA256SUMS.txt"
          (cd "$download" && sha256sum -c --ignore-missing SHA256SUMS.txt)
          tar -xzf "$download/atlas-pairs.tar.gz" -C "$download/unpacked"
          rm -rf website/pages/atlas/pairs
          mv "$download/unpacked/pairs" website/pages/atlas/pairs
          mv "$download/unpacked/manifest.json" website/pages/atlas/pairs/manifest.json
          count=$(find website/pages/atlas/pairs -name '*-*.json' | wc -l)
          test "$count" -gt 0
          echo "atlas-pairs: $count pair files in website/pages/atlas/pairs"

      # The second model's pair explanations (issue #261): the same release,
      # three more assets named with the model's slug. Same rule as above --
      # copied, never built here, and a missing asset fails the job.
      - name: Fetch the Atlas pair explanations of the 4B model
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          download=/tmp/atlas-pairs-qwen3-4b
          mkdir -p "$download/unpacked"
          gh release download atlas-pairs --repo "$GITHUB_REPOSITORY" \
            --pattern 'atlas-pairs-qwen3-4b.tar.gz' --pattern 'SHA256SUMS-qwen3-4b.txt' \
            --dir "$download"
          test -s "$download/atlas-pairs-qwen3-4b.tar.gz"
          grep -q '  atlas-pairs-qwen3-4b.tar.gz$' "$download/SHA256SUMS-qwen3-4b.txt"
          (cd "$download" && sha256sum -c --ignore-missing SHA256SUMS-qwen3-4b.txt)
          tar -xzf "$download/atlas-pairs-qwen3-4b.tar.gz" -C "$download/unpacked"
          rm -rf website/pages/atlas/pairs-qwen3-4b
          mv "$download/unpacked/pairs" website/pages/atlas/pairs-qwen3-4b
          mv "$download/unpacked/manifest.json" website/pages/atlas/pairs-qwen3-4b/manifest.json
          count=$(find website/pages/atlas/pairs-qwen3-4b -name '*-*.json' | wc -l)
          test "$count" -gt 0
          echo "atlas-pairs-qwen3-4b: $count pair files in website/pages/atlas/pairs-qwen3-4b"

      # The lexical baseline's pair explanations (issue #267): BM25, not an
      # embedding, but the same release and the same three-asset shape named
      # with the "model" slug. Same rule as above -- copied, never built here,
      # and a missing asset fails the job.
      - name: Fetch the Atlas pair explanations of the BM25 set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          download=/tmp/atlas-pairs-bm25
          mkdir -p "$download/unpacked"
          gh release download atlas-pairs --repo "$GITHUB_REPOSITORY" \
            --pattern 'atlas-pairs-bm25.tar.gz' --pattern 'SHA256SUMS-bm25.txt' \
            --dir "$download"
          test -s "$download/atlas-pairs-bm25.tar.gz"
          grep -q '  atlas-pairs-bm25.tar.gz$' "$download/SHA256SUMS-bm25.txt"
          (cd "$download" && sha256sum -c --ignore-missing SHA256SUMS-bm25.txt)
          tar -xzf "$download/atlas-pairs-bm25.tar.gz" -C "$download/unpacked"
          rm -rf website/pages/atlas/pairs-bm25
          mv "$download/unpacked/pairs" website/pages/atlas/pairs-bm25
          mv "$download/unpacked/manifest.json" website/pages/atlas/pairs-bm25/manifest.json
          count=$(find website/pages/atlas/pairs-bm25 -name '*-*.json' | wc -l)
          test "$count" -gt 0
          echo "atlas-pairs-bm25: $count pair files in website/pages/atlas/pairs-bm25"

      # The Instruments page's files (issues #289/#290): one JSON per Atlas
      # instrument (its md2akn tree, excerpts, parse flags and nearest texts),
      # ~230 MB, too big for git, so they live in the `atlas-instruments`
      # release, which a human publishes by running the PUBLICAR.md that
      # scripts/embeddings/export_instrument_files.py generates (issue #115,
      # Hallazgo C). Copied, never built here, and a missing release or asset
      # fails the job: the release must exist before the page's pull request
      # is merged.
      - name: Fetch the instrument files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          download=/tmp/atlas-instruments
          mkdir -p "$download/unpacked"
          gh release download atlas-instruments --repo "$GITHUB_REPOSITORY" \
            --pattern 'atlas-instruments-qwen3-4b.tar.gz' --pattern 'SHA256SUMS-qwen3-4b.txt' \
            --dir "$download"
          test -s "$download/atlas-instruments-qwen3-4b.tar.gz"
          grep -q '  atlas-instruments-qwen3-4b.tar.gz$' "$download/SHA256SUMS-qwen3-4b.txt"
          (cd "$download" && sha256sum -c --ignore-missing SHA256SUMS-qwen3-4b.txt)
          tar -xzf "$download/atlas-instruments-qwen3-4b.tar.gz" -C "$download/unpacked"
          rm -rf website/pages/instruments/files
          mv "$download/unpacked/files" website/pages/instruments/files
          mv "$download/unpacked/manifest.json" website/pages/instruments/manifest-qwen3-4b.json
          count=$(find website/pages/instruments/files -name '*.json' | wc -l)
          test "$count" -gt 0
          echo "atlas-instruments: $count instrument files in website/pages/instruments/files"

      # Execution results are frozen (website/_freeze, with `freeze: true` —
      # see _quarto.yml), so rendering needs neither Python nor the local
      # notas-archivo/ raw data. Any re-execution here is a failure, not a
      # slow path.
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
