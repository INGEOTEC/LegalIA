version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"
  apt_packages:
    # `dot`, for sphinx.ext.graphviz's architecture-flow diagram on the
    # index page (see docs/requirements.txt).
    - graphviz
  jobs:
    post_install:
      # Installed in read order (CLAUDE.md: dofjson -> scjn -> nota2md ->
      # dof2md -> md2akn), each pulling in its own real dependencies so
      # autodoc can import it — except dof2md.
      - pip install -e packages/dofjson
      - pip install -e packages/scjn
      - pip install -e packages/nota2md
      # --no-deps: dof2md never imports mineru in-process (see
      # docs/source/conf.py) — it only shells out to the mineru-api CLI —
      # so pulling in the full mineru[pipeline] dependency (and its
      # libgl1/opencv system dependency, see .github/workflows/test.yml)
      # would only slow the docs build down for nothing.
      - pip install --no-deps -e packages/dof2md
      - pip install -e packages/md2akn

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt
